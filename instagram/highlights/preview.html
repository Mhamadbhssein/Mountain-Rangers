<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Highlights Preview</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  :root { --W: 1080px; --H: 1440px; }
  .post { background: radial-gradient(90% 60% at 30% 20%, #23471f 0%, #0d1c0f 55%, #060d07 100%); }
  .wordmark { left: 72px; top: 72px; height: 54px; }
  h1 { position: absolute; left: 70px; top: 176px; font: 700 96px/1 "Inter Display", sans-serif; letter-spacing: -.035em; }
  p.sub { position: absolute; left: 72px; top: 292px; font: 500 34px/1.3 "Inter", sans-serif; color: rgba(255,255,255,.72); letter-spacing: -.01em; }

  .grid { position: absolute; left: 72px; right: 72px; top: 410px; display: grid; grid-template-columns: repeat(3, 1fr); row-gap: 52px; }
  .hl { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .ring { width: 262px; height: 262px; border-radius: 50%; padding: 9px; box-shadow: inset 0 0 0 3px rgba(255,255,255,.28); }
  .ring div { width: 100%; height: 100%; border-radius: 50%; background-size: cover; background-position: center; }
  .hl span { font: 600 32px/1 "Inter Display", sans-serif; letter-spacing: -.01em; }

  /* how the row reads at real size on the profile */
  .strip { position: absolute; left: 44px; right: 44px; bottom: 48px; height: 236px; padding: 30px 36px 0; }
  .strip small { display: block; font: 600 22px/1 "Inter", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.6); }
  .row { display: flex; justify-content: space-between; margin-top: 24px; }
  .mini { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .mini div { width: 112px; height: 112px; border-radius: 50%; background-size: cover; background-position: center;
              box-shadow: 0 0 0 4px #0d1a0f, 0 0 0 6px rgba(255,255,255,.3); }
  .mini span { font: 500 22px/1 "Inter", sans-serif; color: rgba(255,255,255,.85); }
</style>
</head>
<body>
<div class="post" id="post">
  <canvas class="layer" id="glass"></canvas>
  <img class="wordmark" src="../apple-picking/assets/wordmark.png" alt="Mountain Rangers">
  <h1>Highlight covers</h1>
  <p class="sub">A Liquid Glass set for the Mountain Rangers profile</p>
  <div class="grid" id="grid"></div>
  <div class="strip glass" data-radius="56" data-glass='{"gain":1.0,"tint":[255,255,255,0.08]}'>
    <small>On your profile</small>
    <div class="row" id="row"></div>
  </div>
</div>

<script src="../shared/glass.js"></script>
<script>
const G = Glass(1080, 1440);
const ITEMS = [['events', 'Events'], ['hikes', 'Hikes'], ['camping', 'Camping'], ['ski', 'Ski'], ['gallery', 'Gallery'], ['reviews', 'Reviews']];

(async () => {
  for (const [file, label] of ITEMS) {
    const url = `url(highlight-${file}.png)`;
    document.getElementById('grid').insertAdjacentHTML('beforeend',
      `<div class="hl"><div class="ring"><div style="background-image:${url}"></div></div><span>${label}</span></div>`);
    document.getElementById('row').insertAdjacentHTML('beforeend',
      `<div class="mini"><div style="background-image:${url}"></div><span>${label}</span></div>`);
  }
  await G.ready();
  await Promise.all(ITEMS.map(([f]) => G.load(`highlight-${f}.png`)));
  G.sizeCanvases('glass');
  // glass refracts the page's own gradient
  const bg = G.mk(1080, 1440), x = bg.getContext('2d');
  const g = x.createRadialGradient(324, 288, 0, 324, 288, 1100);
  g.addColorStop(0, '#23471f'); g.addColorStop(0.55, '#0d1c0f'); g.addColorStop(1, '#060d07');
  x.fillStyle = g; x.fillRect(0, 0, 1080, 1440);
  G.glassPanels(document.getElementById('glass'), document.getElementById('post'), G.backdrop(bg, 10));
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
