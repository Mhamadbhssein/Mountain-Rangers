<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Highlight Cover</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  /* 1080x1920 story frame; Instagram crops highlight covers to a centre circle */
  :root { --W: 1080px; --H: 1920px; }
  .disc { position: absolute; left: 120px; top: 540px; width: 840px; height: 840px; display: grid; place-items: center; }
  .disc svg { width: 440px; height: 440px; fill: none; stroke: #fff; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
              filter: drop-shadow(0 6px 18px rgba(0,0,0,.25)); overflow: visible; }
  .disc svg .fill { fill: #fff; stroke: none; }
</style>
</head>
<body>
<div class="post" id="post">
  <canvas class="layer" id="bg"></canvas>
  <canvas class="layer" id="glass"></canvas>
  <div class="disc glass" data-shape="circle" data-glass='{"bezel":22,"refract":70,"gain":1.05,"tint":[255,255,255,0.14],"rimKey":0.9,"rimBack":0.5}'>
    <svg viewBox="0 0 24 24" id="icon"></svg>
  </div>
</div>

<template id="events"><svg>
  <rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 9.8h17M8 3v4M16 3v4"/>
  <circle class="fill" cx="8" cy="13.4" r="1.05"/><circle class="fill" cx="12" cy="13.4" r="1.05"/><circle class="fill" cx="16" cy="13.4" r="1.05"/>
  <circle class="fill" cx="8" cy="17" r="1.05"/><circle class="fill" cx="12" cy="17" r="1.05"/>
</svg></template>
<template id="hikes"><svg>
  <path d="M2.5 20 9 9l3.6 6 2.4-3.4L21.5 20Z"/><path d="M9 9V3.5l4 1.6L9 6.8"/>
</svg></template>
<template id="camping"><svg>
  <path d="M2.5 20.5h19"/><path d="M12 5 4 20.5M12 5l8 15.5"/><path d="M9.3 20.5 12 15l2.7 5.5"/><path d="M10.3 3 12 5l1.7-2"/>
</svg></template>
<template id="ski"><svg>
  <g id="arm"><path d="M12 2.5v19"/><path d="m9.4 4.6 2.6 2.4 2.6-2.4M9.4 19.4 12 17l2.6 2.4"/></g>
  <use href="#arm" transform="rotate(60 12 12)"/><use href="#arm" transform="rotate(-60 12 12)"/>
</svg></template>
<template id="gallery"><svg>
  <path d="M3.5 8.2h3.8l1.6-2.7h6.2l1.6 2.7h3.8v11.3h-17Z"/><circle cx="12" cy="13.6" r="3.6"/>
</svg></template>
<template id="reviews"><svg>
  <path d="M12 2.8l2.85 5.8 6.4.93-4.63 4.5 1.1 6.37L12 17.4l-5.72 3l1.1-6.37-4.63-4.5 6.4-.93Z"/>
</svg></template>

<script src="../shared/glass.js"></script>
<script>
const G = Glass(1080, 1920);
const name = new URLSearchParams(location.search).get('icon') || 'events';

// deep forest backdrop with a lime glow and topographic contour lines
function paintBackdrop() {
  const c = G.mk(1080, 1920), x = c.getContext('2d');
  const g = x.createRadialGradient(540, 860, 40, 540, 960, 1150);
  g.addColorStop(0, '#2f5a2c'); g.addColorStop(0.45, '#163218'); g.addColorStop(1, '#07130a');
  x.fillStyle = g; x.fillRect(0, 0, 1080, 1920);
  const blob = (cx, cy, r, col) => {
    const b = x.createRadialGradient(cx, cy, 0, cx, cy, r);
    b.addColorStop(0, col); b.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = b; x.fillRect(0, 0, 1080, 1920);
  };
  blob(330, 700, 420, 'rgba(166,240,90,.45)');
  blob(800, 1260, 460, 'rgba(70,170,120,.35)');
  blob(720, 640, 300, 'rgba(240,200,120,.18)');
  // topographic contour lines: iso-lines of a few soft "peaks" (marching squares)
  const peaks = [[300, 700, 1.0, 260], [830, 1260, 0.85, 300], [930, 360, 0.55, 210], [140, 1620, 0.6, 250]];
  const f = (px, py) => {
    let v = 0.06 * Math.sin(px / 95 + 1.3) * Math.cos(py / 130 - 0.4);
    for (const [cx, cy, a, sd] of peaks) v += a * Math.exp(-((px - cx) ** 2 + (py - cy) ** 2) / (2 * sd * sd));
    return v;
  };
  const step = 6, cols = Math.ceil(1080 / step) + 1, rows = Math.ceil(1920 / step) + 1;
  const F = new Float32Array(cols * rows);
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) F[j * cols + i] = f(i * step, j * step);
  x.lineWidth = 2; x.lineCap = 'round'; x.strokeStyle = 'rgba(190,255,140,.17)';
  x.beginPath();
  for (let lv = 0.04; lv < 1.05; lv += 0.05) {
    for (let j = 0; j < rows - 1; j++) for (let i = 0; i < cols - 1; i++) {
      const a = F[j * cols + i], b = F[j * cols + i + 1], c2 = F[(j + 1) * cols + i + 1], d = F[(j + 1) * cols + i];
      const px = i * step, py = j * step, pts = [];
      const edge = (v1, v2, x1, y1, x2, y2) => {
        if ((v1 < lv) !== (v2 < lv)) { const t = (lv - v1) / (v2 - v1); pts.push([x1 + (x2 - x1) * t, y1 + (y2 - y1) * t]); }
      };
      edge(a, b, px, py, px + step, py);
      edge(b, c2, px + step, py, px + step, py + step);
      edge(c2, d, px + step, py + step, px, py + step);
      edge(d, a, px, py + step, px, py);
      for (let k = 0; k + 1 < pts.length; k += 2) { x.moveTo(...pts[k]); x.lineTo(...pts[k + 1]); }
    }
  }
  x.stroke();
  return c;
}

(async () => {
  document.getElementById('icon').innerHTML = document.getElementById(name).content.querySelector('svg').innerHTML;
  await G.ready();
  G.sizeCanvases('bg', 'glass');
  const art = paintBackdrop();
  document.getElementById('bg').getContext('2d').drawImage(art, 0, 0, 1080 * G.S, 1920 * G.S);
  G.glassPanels(document.getElementById('glass'), document.getElementById('post'), G.backdrop(art, 14, 'saturate(1.3)'));
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
