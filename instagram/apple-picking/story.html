<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple Picking Story</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  /* Instagram covers roughly the top 220px and bottom 250px of a story; keep content inside. */
  :root { --W: 1080px; --H: 1920px; }
  .scrim {
    background:
      linear-gradient(180deg, rgba(10,20,8,.55) 0%, rgba(10,20,8,.18) 22%, rgba(0,0,0,0) 34%),
      linear-gradient(0deg, rgba(8,10,6,.70) 0%, rgba(8,10,6,.25) 20%, rgba(0,0,0,0) 32%),
      radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 60%, rgba(0,0,0,.22) 100%);
  }
  .wordmark { left: 50%; top: 232px; height: 62px; transform: translateX(-50%); }
  .dateline { top: 342px; font-size: 46px; }
  .widget { left: 44px; right: 44px; top: 1438px; height: 254px; }
  .cal { position: absolute; right: 32px; top: 58px; }
</style>
</head>
<body>
<div class="post" id="post">
  <img class="layer" src="assets/photo.jpg" alt="">
  <div class="layer scrim"></div>
  <canvas class="layer" id="headline"></canvas>
  <img class="layer" src="assets/subject.png" alt="">
  <canvas class="layer" id="glass"></canvas>

  <img class="wordmark" src="assets/wordmark.png" alt="Mountain Rangers">
  <div class="dateline">Sunday 18 October</div>

  <div class="widget glass" data-radius="58">
    <div class="w-head">
      <div class="appicon"><img src="assets/emblem.png" alt=""></div>
      <div class="w-app">Mountain Rangers</div>
    </div>
    <div class="w-body">
      <div class="w-title">Hike &amp; Apple Picking</div>
      <div class="w-meta">
        <span>
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 21.5s-7-6.1-7-11.6A7 7 0 0 1 19 9.9c0 5.5-7 11.6-7 11.6Z" fill="rgba(255,255,255,.92)"/><circle cx="12" cy="9.8" r="2.6" fill="#3a4a2c"/></svg>
          Baskinta, Mount Lebanon
        </span>
      </div>
    </div>
    <div class="cal"><b>SUN</b><i>18</i></div>
  </div>
</div>

<script src="../shared/glass.js"></script>
<script>
const G = Glass(1080, 1920);

(async () => {
  await G.ready();
  const photo = G.cover(await G.load('assets/photo.jpg'));
  G.sizeCanvases('headline', 'glass');
  G.glassText(document.getElementById('headline'), ["APPLE", "PICKING"],
    { top: 406, bottom: 930, maxW: 880, gap: 26 },
    G.backdrop(photo, 6, 'saturate(1.0) brightness(1.45)'));
  G.glassPanels(document.getElementById('glass'), document.getElementById('post'),
    G.backdrop(photo, 22, 'saturate(1.7) brightness(0.92)'));
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
