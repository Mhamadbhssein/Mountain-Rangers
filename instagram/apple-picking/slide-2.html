<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What To Bring</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  :root { --W: 1080px; --H: 1440px; }
  .scrim {
    background:
      linear-gradient(180deg, rgba(10,20,8,.55) 0%, rgba(10,20,8,.20) 24%, rgba(0,0,0,.05) 40%),
      rgba(0,0,0,.10);
  }
  .wordmark { left: 56px; top: 60px; height: 56px; }
  .pill { right: 56px; top: 59px; }

  .title { position: absolute; left: 60px; top: 168px; font: 700 104px/1 "Inter Display", sans-serif; letter-spacing: -.035em; text-shadow: 0 4px 30px rgba(0,0,0,.25); }
  .sub { position: absolute; left: 62px; top: 288px; font: 500 34px/1 "Inter", sans-serif; letter-spacing: -.01em; color: rgba(255,255,255,.85); }

  .list { position: absolute; left: 44px; right: 44px; top: 372px; bottom: 48px; padding: 38px 40px 20px 40px; }
  .l-head { display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 14px; }
  .l-name { font: 700 50px/1 "Inter Display", sans-serif; letter-spacing: -.02em; color: var(--lime); }
  .l-count { font: 700 50px/1 "Inter Display", sans-serif; color: rgba(255,255,255,.9); }

  .row { display: flex; align-items: center; gap: 28px; height: 150px; position: relative; }
  .row + .row::before {
    content: ""; position: absolute; left: 76px; right: 0; top: 0; height: 1.5px; background: rgba(255,255,255,.2);
  }
  .ring { width: 48px; height: 48px; border-radius: 50%; border: 3.5px solid rgba(255,255,255,.62); flex: none; }
  .txt { flex: 1; }
  .txt b { display: block; font: 600 40px/1.1 "Inter Display", sans-serif; letter-spacing: -.015em; }
  .txt span { display: block; margin-top: 8px; font: 400 28px/1.2 "Inter", sans-serif; color: rgba(255,255,255,.72); letter-spacing: -.005em; }
  .ico { width: 70px; height: 70px; border-radius: 22px; flex: none; display: grid; place-items: center;
         background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); }
  .ico svg { width: 38px; height: 38px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="post" id="post">
  <img class="layer" src="assets/photo.jpg" alt="">
  <div class="layer scrim"></div>
  <canvas class="layer" id="glass"></canvas>

  <img class="wordmark" src="assets/wordmark.png" alt="Mountain Rangers">
  <div class="pill glass" data-shape="capsule" data-glass='{"gain":1.05}'><span class="dot"></span>Sunday 18 Oct</div>

  <div class="title">What to bring</div>
  <div class="sub">Hike &amp; Apple Picking · Baskinta</div>

  <div class="list glass" data-radius="64">
    <div class="l-head"><div class="l-name">Trail kit</div><div class="l-count">6</div></div>

    <div class="row"><div class="ring"></div>
      <div class="txt"><b>Hiking shoes</b><span>Closed shoes with a good grip</span></div>
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M6.8 3.5h5.7V10l4.9 1.7c2.1.7 3.6 2.3 3.6 4.3v2H5.4Z"/><path d="M4.4 21h17.2"/><path d="M9 6.8h3.5M9 9.6h3.5"/></svg></div>
    </div>
    <div class="row"><div class="ring"></div>
      <div class="txt"><b>Water</b><span>At least 1.5 L each</span></div>
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 3.5s6 6.6 6 10.8a6 6 0 0 1-12 0C6 10.1 12 3.5 12 3.5Z"/><path d="M9.2 14.6a2.9 2.9 0 0 0 2.6 2.7"/></svg></div>
    </div>
    <div class="row"><div class="ring"></div>
      <div class="txt"><b>A warm layer</b><span>Mountain mornings get chilly</span></div>
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M8.5 4 12 6.5 15.5 4l4.5 3-2 4.5-2-1V20H8V10.5l-2 1L4 7Z"/><path d="M12 6.5V20"/></svg></div>
    </div>
    <div class="row"><div class="ring"></div>
      <div class="txt"><b>Cap &amp; sunscreen</b><span>The sun is strong at altitude</span></div>
      <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></div>
    </div>
    <div class="row"><div class="ring"></div>
      <div class="txt"><b>Snacks</b><span>Fuel for the trail</span></div>
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M13 2.5 5 13.5h6L10 21.5l8-11h-6Z"/></svg></div>
    </div>
    <div class="row"><div class="ring"></div>
      <div class="txt"><b>A tote bag</b><span>For the apples you pick</span></div>
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M5.5 8.5h13l-1.2 12H6.7Z"/><path d="M9 8.5V7a3 3 0 0 1 6 0v1.5"/></svg></div>
    </div>
  </div>
</div>

<script src="../shared/glass.js"></script>
<script>
const G = Glass(1080, 1440);

(async () => {
  await G.ready();
  const photo = await G.load('assets/photo.jpg');
  G.sizeCanvases('glass');
  G.glassPanels(document.getElementById('glass'), document.getElementById('post'),
    G.backdrop(photo, 26, 'saturate(1.6) brightness(0.62)'));
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
