<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join Us Invite</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  :root { --W: 1080px; --H: 1440px; }
  .bg { filter: blur(44px) saturate(1.5) brightness(.78); transform: scale(1.2); }

  .card { position: absolute; left: 72px; right: 72px; top: 96px; bottom: 96px; padding: 28px; text-align: center; }
  .hero { position: relative; width: 880px; height: 660px; border-radius: 52px; overflow: hidden;
          box-shadow: 0 18px 50px rgba(0,0,0,.25); }
  .hero .shot { width: 100%; height: 100%; object-fit: cover; object-position: 50% 72%; display: block; }
  .hero::after { content: ""; position: absolute; inset: 0;
                 background: linear-gradient(180deg, rgba(0,0,0,.28) 0%, rgba(0,0,0,0) 30%); }
  .invited { position: absolute; left: 28px; top: 28px; z-index: 1; height: 56px; padding: 0 24px 0 18px; border-radius: 28px;
             display: flex; align-items: center; gap: 10px;
             background: rgba(255,255,255,.2); backdrop-filter: blur(18px) saturate(1.6);
             box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 0 0 1px rgba(255,255,255,.18);
             font: 600 25px/1 "Inter Display", sans-serif; }
  .invited svg { width: 26px; height: 26px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .hero .wm { position: absolute; right: 30px; top: 32px; height: 46px; z-index: 1; filter: drop-shadow(0 2px 10px rgba(0,0,0,.3)); }

  .t { margin-top: 46px; font: 700 78px/1 "Inter Display", sans-serif; letter-spacing: -.035em; }
  .d { margin-top: 22px; font: 600 38px/1 "Inter Display", sans-serif; letter-spacing: -.01em; color: rgba(255,255,255,.94); }
  .l { margin-top: 16px; display: inline-flex; align-items: center; gap: 10px; font: 500 32px/1 "Inter", sans-serif; color: rgba(255,255,255,.8); letter-spacing: -.01em; }
  .l svg { width: 30px; height: 30px; }

  .host { margin: 34px auto 0; padding-top: 30px; border-top: 1.5px solid rgba(255,255,255,.18); width: 760px;
          display: flex; align-items: center; justify-content: center; gap: 16px;
          font: 500 30px/1 "Inter", sans-serif; color: rgba(255,255,255,.82); }
  .host b { font-weight: 600; color: #fff; }
  .avatar { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center;
            background: linear-gradient(160deg, #24452a, #102615); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.2); }
  .avatar img { width: 48px; }

  .actions { position: absolute; left: 28px; right: 28px; bottom: 30px; display: flex; gap: 20px; }
  .btn { height: 106px; border-radius: 53px; display: flex; align-items: center; justify-content: center; gap: 14px;
         font: 600 36px/1 "Inter Display", sans-serif; letter-spacing: -.01em; }
  .btn svg { width: 36px; height: 36px; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .primary { flex: 1; background: linear-gradient(180deg, #b9f777 0%, #96e14a 100%); color: #0f2a10;
             box-shadow: 0 12px 30px rgba(120,200,60,.35), inset 0 1.5px 0 rgba(255,255,255,.6), inset 0 -2px 0 rgba(0,0,0,.08); }
  .primary svg { stroke: #0f2a10; }
  .secondary { width: 290px; }
  .secondary svg { stroke: #fff; }
</style>
</head>
<body>
<div class="post" id="post">
  <img class="layer bg" src="assets/photo.jpg" alt="">
  <canvas class="layer" id="glass"></canvas>

  <div class="card glass" data-radius="76" data-glass='{"gain":0.95,"tint":[255,255,255,0.12]}'>
    <div class="hero">
      <img class="shot" src="assets/photo.jpg" alt="Hands holding freshly picked green apples">
      <div class="invited">
        <svg viewBox="0 0 24 24"><path d="M4 7.5h16v12H4z"/><path d="m4 7.5 8 6 8-6"/></svg>
        You're invited
      </div>
      <img class="wm" src="assets/wordmark.png" alt="">
    </div>
    <div class="t">Hike &amp; Apple Picking</div>
    <div class="d">Sunday 18 October</div>
    <div class="l">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 21.5s-7-6.1-7-11.6A7 7 0 0 1 19 9.9c0 5.5-7 11.6-7 11.6Z" fill="rgba(255,255,255,.85)"/><circle cx="12" cy="9.8" r="2.6" fill="#4a4436"/></svg>
      Baskinta, Mount Lebanon
    </div>
    <div class="host">
      <div class="avatar"><img src="assets/emblem.png" alt=""></div>
      <span>Hosted by <b>Mountain Rangers</b></span>
    </div>
    <div class="actions">
      <div class="btn primary">
        <svg viewBox="0 0 24 24"><path d="M21 3 10.5 13.5"/><path d="M21 3 14.5 21l-4-7.5L3 9.5Z"/></svg>
        DM us to book
      </div>
      <div class="btn secondary glass" data-shape="capsule" data-glass='{"gain":1.0,"tint":[255,255,255,0.14]}'>
        <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7.5 7.5 4.5-4.5 4.5 4.5"/><path d="M8 10.5H6.5a1.5 1.5 0 0 0-1.5 1.5v7.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V12a1.5 1.5 0 0 0-1.5-1.5H16"/></svg>
        Share
      </div>
    </div>
  </div>
</div>

<script src="../shared/glass.js"></script>
<script>
const G = Glass(1080, 1440);

(async () => {
  await G.ready();
  const photo = await G.load('assets/photo.jpg');
  G.sizeCanvases('glass');
  // the visible background is the photo heavily blurred; glass refracts the same thing
  G.glassPanels(document.getElementById('glass'), document.getElementById('post'),
    G.backdrop(photo, 44, 'saturate(1.5) brightness(0.78)'));
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
